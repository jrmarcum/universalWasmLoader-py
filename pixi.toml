[project]
name = "universal-wasm-loader"
# Mirrors pyproject.toml [project] version (the single source of truth that the
# bump-version / release / publish scripts read & write). Kept in sync by
# scripts/bump-version.{sh,nu}.
version = "1.0.0"
description = "Universal WASM loader for Python"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks]
test = "pytest tests/ -v"
lint = "ruff check src/ tests/"
fmt = "ruff format src/ tests/"
typecheck = "mypy src/"
# Versioning / release toolchain lives in scripts/ as paired Bash + Nushell forms
# (bump-version, release, publish). Run them directly, e.g.
#   bash scripts/bump-version.sh minor   |   nu scripts/bump-version.nu minor
#   bash scripts/release.sh              |   nu scripts/release.nu
#   bash scripts/publish.sh --yes        |   nu scripts/publish.nu --yes

[dependencies]
python = ">=3.11,<4"

[pypi-dependencies]
universal-wasm-loader = { path = ".", editable = true }
wasmtime = ">=26.0.0"

[feature.dev.pypi-dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
ruff = ">=0.9.0"
mypy = ">=1.10.0"

# Packaging toolchain — `scripts/release.{sh,nu}` and `scripts/publish.{sh,nu}`
# run `pixi run python -m build` / `... -m twine ...` inside this env.
[feature.publish.pypi-dependencies]
build = ">=1.2.0"
twine = ">=5.0.0"

[environments]
default = { features = ["dev", "publish"], solve-group = "default" }
