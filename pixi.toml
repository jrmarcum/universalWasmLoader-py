[project]
name = "universal-wasm-loader"
version = "0.1.0"
description = "Universal WASM loader for Python"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64", "osx-64", "osx-arm64"]

[tasks]
test = "pytest tests/ -v"
lint = "ruff check src/ tests/"
fmt = "ruff format src/ tests/"
typecheck = "mypy src/"
# Raise the version in pyproject.toml (patch default; minor/major). Mirrors -js's
# `deno task bump`. Then `bash scripts/release.sh` tags vX.Y.Z + pushes -> CI publishes.
bump = "python scripts/bump.py"

[dependencies]
python = ">=3.11,<4"

[pypi-dependencies]
universal-wasm-loader = { path = ".", editable = true }
wasmtime = ">=26.0.0"

[feature.dev.pypi-dependencies]
pytest = ">=8.0.0"
pytest-asyncio = ">=0.23.0"
ruff = ">=0.9.0"
mypy = ">=1.10.0"

[environments]
default = { features = ["dev"], solve-group = "default" }
