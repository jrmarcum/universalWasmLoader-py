[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "universal-wasm-loader"
version = "1.0.0"
description = "Universal WASM loader for Python"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jon Marcum", email = "jrmarcum.se@gmail.com" }]
requires-python = ">=3.11"
keywords = ["wasm", "webassembly", "loader", "wit", "canonical-abi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["wasmtime>=26.0.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.9.0",
    "mypy>=1.10.0",
]

[project.urls]
Homepage = "https://github.com/jrmarcum/universalWasmLoader-py"
Repository = "https://github.com/jrmarcum/universalWasmLoader-py"

[tool.hatch.build.targets.wheel]
packages = ["src/universal_wasm_loader"]

# Ship the MIT LICENSE (and the user-facing docs) inside the sdist so the license
# travels with the published package. Hatchling already auto-includes LICENSE* in
# the wheel's .dist-info; this makes the sdist contents explicit.
[tool.hatch.build.targets.sdist]
include = [
    "src/universal_wasm_loader",
    "tests",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
src = ["src"]
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
